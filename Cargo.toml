[package]
name = "health_plugin"
version = "0.1.0"
edition = "2024"

[features]
default = []
client = ["dep:health_client"]
server = ["dep:health_server"]

[dependencies]
health_shared = { path = "shared", default-features = false }
health_client = { path = "client", optional = true }
health_server = { path = "server", optional = true }

[workspace]
members = [
    "client",
    "server",
    "shared"
]
resolver = "2"

[workspace.dependencies]
bevy = { version = "0.19.1", features = ["dynamic_linking", "bevy_ui_widgets"] }
lightyear = { git = "https://github.com/cBournhonesque/lightyear.git", branch = "main", default-features = false, features = [
    "netcode",
    "replication",
    "prediction",
    "interpolation",
    "avian3d", 
    "udp", 
    "crossbeam",
    "input_bei",
    ]}
serde = { version = "1.0", features = ["derive"]}
rand = "0.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3